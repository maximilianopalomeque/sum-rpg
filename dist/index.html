<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1a1f"><title>SUM-0 · Error de fábrica</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game" class="game" aria-label="Aventura de SUM-0">
 <canvas id="scene" aria-label="SUM-0 se enfrenta a robots en una fábrica pixelada"></canvas>
 <div class="hud-top">
  <section class="plate player-plate" aria-label="Estado de SUM-0">
   <div class="plate-head"><b>SUM-0</b><span id="hpText">6/6</span></div>
   <div id="hearts" class="hearts" aria-hidden="true"></div>
   <div class="plate-row"><span class="combo" id="combo">RACHA 0</span></div>
   <div id="powers" class="powers"></div>
   <div class="abilities"><button id="freeze" class="ability" hidden>CONGELAR · F</button><button id="special" class="ability" hidden>PULSO 0/4 · R</button></div>
  </section>
  <section class="stage-info">
   <div id="chapter" class="chapter">DEPÓSITO</div>
   <ol id="route" class="route" aria-label="Ruta de escape"><li></li><li></li><li></li></ol>
   <div id="progress" class="progress">1/6</div>
  </section>
  <section class="plate enemy-plate" aria-label="Enemigo">
   <div class="plate-head"><b id="enemyName">ESCOB-01</b></div>
   <div class="enemy-bar"><i id="enemyBar"></i></div>
   <span id="enemyHealth" class="enemy-health">3 / 3</span>
  </section>
  <div class="sys"><button id="sound" class="icon-btn" aria-label="Activar sonido"></button><button id="pause" class="icon-btn" aria-label="Pausar juego"></button></div>
 </div>
 <div class="hud-bottom">
  <div class="timer"><div id="timerBar"></div></div>
  <div class="answer-row">
   <div class="equation" id="equation"><span id="sum">3 + 2</span><span class="eq-sign">=</span>
    <label class="sr-only" for="answer">Resultado de la suma</label><input id="answer" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3" placeholder="?" aria-label="Resultado de la suma"></div>
   <button class="primary fire" id="submit">DISPARAR</button>
   <span id="timerLabel" class="timer-label">14.0</span>
  </div>
  <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
 </div>
 <div class="overlay" id="overlay" hidden></div>
</main>
<script type="module" src="main.js"></script></body></html>
